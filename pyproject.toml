[project]
name = "cleaner"
version = "0.1.0"
description = "LLM-driven data cleaning agent for telecom customer and usage data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "sqlglot>=25",
    "pydantic>=2.8",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ollama>=0.4",
    "kaggle>=1.6",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
